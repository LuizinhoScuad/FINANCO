name: CI

# Existe por causa de uma regressão real: um commit sobrescreveu arquivos com
# cópias antigas e apagou funcionalidades já entregues — recibos, layout do
# celular, gráfico anual. Ninguém percebeu até o app estar quebrado em produção.
# Estes portões impedem que isso se repita em silêncio.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: Lint, tipos, testes e build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Instalar dependências
        run: npm ci

      # Primeiro portão, e o mais barato: o repositório continua no formato
      # descrito em specs/03-HARNESS.md — sem arquivo solto na raiz, sem script
      # não documentado, sem teste de banco vazando para o portão rápido.
      - name: Estrutura do repositório
        run: npm run verificar:estrutura

      - name: Lint
        run: npm run lint

      - name: Verificação de tipos
        run: npm run typecheck

      - name: Testes
        run: npm test

      # O Guardião roda com credencial de administrador, que ignora as regras de
      # segurança. Esta checagem prova por máquina que ele só observa (Art. 9).
      - name: Guardião não escreve
        run: npm run scan:verificar

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ci-placeholder
          NEXT_PUBLIC_FIREBASE_API_KEY: ci-placeholder
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ci-placeholder
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ci-placeholder
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "0"
          NEXT_PUBLIC_FIREBASE_APP_ID: ci-placeholder
